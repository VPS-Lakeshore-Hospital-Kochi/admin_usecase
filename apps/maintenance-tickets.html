<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance ticket analyser</title>
<link rel="stylesheet" href="../shared/hub.css">
</head>
<body>
<main class="wrap">
  <section class="page-head">
    <h1>Maintenance ticket analyser</h1>
    <p>Scan a batch of maintenance tickets for repeat failures, response time and repair-vs-replace signals.</p>
  </section>

  <div id="kpis" class="kpis"></div>

  <div class="grid cols-2">
    <div class="card">
      <h2>Sample ticket log</h2>
      <div class="row">
        <label style="margin:0" for="scenario">Scenario</label>
        <select id="scenario">
          <option value="mixed">Mixed facility tickets — Sep 2026</option>
          <option value="biomed">Biomedical equipment tickets — Sep 2026</option>
        </select>
      </div>
      <label>Asset | Location | Complaint | Opened | Closed | Cost (₹) — editable</label>
      <textarea id="tickets" rows="14"></textarea>
      <div id="ticketTable"></div>
      <div class="row" style="margin-top:12px"><button class="primary" id="runBtn">Run with Claude</button></div>
    </div>
    <div class="card">
      <h2>Claude output</h2>
      <div class="claude-out" id="out"></div>
    </div>
  </div>
  <p class="footer-note">Synthetic ticket data for demonstration only.</p>
</main>

<script src="../shared/claude.js"></script>
<script>
Hub.mountHeader({ dept: 'Facilities & Biomedical', title: 'Maintenance ticket analyser' });

const SCENARIOS = {
  mixed: {
    text: `Asset | Location | Complaint | Opened | Closed | Cost

Nurse call panel | 3rd floor ward | Panel unresponsive, 6 beds affected | 2026-09-08 | 2026-09-09 | 3200

AHU-3 | 4th floor ICU | Not cooling, 4th complaint | 2026-09-21 | 2026-09-24 | 41000

  },
  biomed: {
    text: `Asset | Location | Complaint | Opened | Closed | Cost
Ventilator V-4 | ICU | Alarm malfunction | 2026-09-01 | 2026-09-02 | 6500
Infusion pump IP-12 | Oncology ward | Flow rate inaccurate | 2026-09-02 | 2026-09-02 | 2200
Ventilator V-4 | ICU | Alarm malfunction again | 2026-09-05 | 2026-09-07 | 15000

Ventilator V-4 | ICU | Third alarm fault, same unit | 2026-09-12 | 2026-09-15 | 32000
Dialysis machine D-3 | Dialysis unit | Conductivity alarm | 2026-09-13 | 2026-09-14 | 7200
Defibrillator DF-2 | Emergency | Battery not holding charge | 2026-09-16 | 2026-09-17 | 5400
Infusion pump IP-12 | Oncology ward | Flow error, fourth time | 2026-09-18 | 2026-09-18 | 2200

Ventilator V-9 | ICU | Sensor calibration drift | 2026-09-21 | 2026-09-22 | 8800

Ventilator V-4 | ICU | Fourth fault, unresolved noise | 2026-09-26 | 2026-09-27 | 27000`,
  },
};

function daysBetween(a, b) { return Math.max(0, Math.round((new Date(b) - new Date(a)) / 86400000)) || (a === b ? 0 : 1); }

function parseTickets(text) {
  return text.trim().split('\n').slice(1).filter(Boolean).map(r => {
    const c = r.split('|').map(x => x.trim());
    return { asset: c[0], loc: c[1], complaint: c[2], opened: c[3], closed: c[4], cost: +c[5] };
  });
}

function renderTable(rows) {
  const counts = {};
  rows.forEach(r => counts[r.asset] = (counts[r.asset] || 0) + 1);
  const trs = rows.map(r => {
    const ttr = daysBetween(r.opened, r.closed);
    const repeat = counts[r.asset] > 1;
    return `<tr><td>${Hub.esc(r.asset)}</td><td>${Hub.esc(r.complaint)}</td><td class="num">${ttr}d</td><td class="num">${Hub.inr(r.cost)}</td><td>${repeat ? `<span class="tag warn">Repeat x${counts[r.asset]}</span>` : '<span class="tag ok">Single</span>'}</td></tr>`;
  }).join('');
  document.getElementById('ticketTable').innerHTML = `<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Complaint</th><th class="num">TTR</th><th class="num">Cost</th><th>Pattern</th></tr></thead><tbody>${trs}</tbody></table></div>`;

  const mttr = (rows.reduce((s, r) => s + daysBetween(r.opened, r.closed), 0) / rows.length).toFixed(1);
  const repeatAssets = Object.values(counts).filter(c => c > 1).length;
  const totalCost = rows.reduce((s, r) => s + r.cost, 0);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Tickets</div><div class="value">${rows.length}</div></div>
    <div class="kpi"><div class="label">MTTR</div><div class="value">${mttr}d</div></div>
    <div class="kpi"><div class="label">Repeat-failure assets</div><div class="value">${repeatAssets}</div></div>
    <div class="kpi"><div class="label">Total repair spend</div><div class="value">${Hub.inr(totalCost)}</div></div>`;
}

function loadScenario(key) {
  document.getElementById('tickets').value = SCENARIOS[key].text;
  renderTable(parseTickets(SCENARIOS[key].text));
}
document.getElementById('scenario').addEventListener('change', e => loadScenario(e.target.value));
document.getElementById('tickets').addEventListener('change', e => { try { renderTable(parseTickets(e.target.value)); } catch (err) {} });
loadScenario('mixed');

const DEMO = {
mixed: `## Repeat-failure patterns

| Asset | Occurrences | Pattern |
|---|---|---|
| AHU-3 (4th floor ICU) | 4 tickets | Recurring "not cooling" complaints with escalating cost (₹8,500 → ₹41,000) and lengthening repair time — classic sign of a worsening compressor fault being patched, not fixed |
| Lift-2 door sensor | 3 tickets | Same sensor fault three times in a month, each low-cost but disruptive to a main-block lift |
| Nurse call panel (3rd floor) | 2 tickets | Intermittent recurrence on a patient-safety-linked system |

## Repair vs replace calls
- **AHU-3: recommend replace, not repair.** Four failures in a month with cost escalating 5x from first to last incident strongly suggests compressor-level failure. Cumulative spend (₹1,01,500) is approaching a meaningful fraction of a new unit's cost — continuing to repair risks an ICU cooling failure at the worst possible time.
- **Lift-2 door sensor: repair, but escalate to vendor.** Low per-incident cost (~₹1,800-2,200) but repeated failure of the same part suggests a defective replacement part or installation fault — request a root-cause fix under warranty rather than repeated call-outs.

## Preventive maintenance gaps
- No ticket log shows a scheduled PM visit for AHU-3 between the four breakdown calls — this points to a **reactive-only maintenance pattern** for HVAC in critical care areas. Recommend monthly PM checks for ICU-serving AHUs specifically, given patient safety exposure.
- RO plant (dialysis) shows a single but costly incident (₹22,000, 2-day resolution) — verify PM schedule compliance given the criticality of water quality for dialysis.

## Vendor performance
- **AHU-3 vendor's repair 3 and 4 did not resolve the underlying fault** (recurrence within days), suggesting either misdiagnosis or a stop-gap fix — this vendor's technical competence on this specific unit should be reviewed before the next AMC renewal.
- Lift-2 vendor resolved each incident same-day, which is a positive response-time signal, but the repeat pattern points to a parts-quality issue rather than technician performance.`,

biomed: `## Repeat-failure patterns

| Asset | Occurrences | Pattern |
|---|---|---|
| Ventilator V-4 (ICU) | 4 tickets | Alarm-fault recurrence with sharply rising cost (₹6,500 → ₹27,000) and lengthening repair time — the most serious pattern in this log given ICU criticality |
| Infusion pump IP-12 (Oncology) | 4 tickets | Repeated flow-rate inaccuracy, each relatively low-cost but affecting chemotherapy dosing accuracy — a patient-safety concern regardless of repair cost |
| Cath lab monitor | 2 tickets | Display flickering recurring within two weeks |

## Repair vs replace calls
- **Ventilator V-4: recommend replace.** Four alarm-related faults in under a month with cost escalating 4x and the final ticket still open with "unresolved noise" — this unit should be taken out of ICU rotation and referred for replacement rather than a fifth repair attempt, given the life-critical nature of ventilator alarms.
- **Infusion pump IP-12: repair under warranty/escalate to vendor**, but given oncology dosing accuracy is safety-critical, consider a temporary swap to a backup pump while root cause is investigated rather than repeated field fixes.

## Preventive maintenance gaps
- No PM visits appear between V-4's four breakdown tickets — critical-care ventilators should be on a stricter calibration/PM cycle (e.g., monthly) rather than reactive-only servicing.
- IP-12's recurring flow-rate fault suggests calibration drift not being caught by routine PM — recommend adding a flow-rate verification step to the standard biomedical PM checklist for infusion pumps.

## Vendor performance
- **V-4's repeated unresolved faults** raise a real question about whether the biomedical vendor is correctly diagnosing an alarm/sensor issue versus a deeper hardware fault — recommend an independent second opinion before further spend.
- Cath lab monitor's second fault occurring within two weeks of the first "repair" suggests the initial fix was incomplete — request a formal root-cause report from the vendor before payment for the second visit.`
};

document.getElementById('runBtn').addEventListener('click', () => {
  const key = document.getElementById('scenario').value;
  const text = document.getElementById('tickets').value;
  const prompt = `You are assisting Facilities & Biomedical at VPS Lakeshore Hospital, Kochi in reviewing a batch of maintenance tickets.

Ticket log (Asset | Location | Complaint | Opened | Closed | Cost ₹):
${text}

Provide: (1) repeat-failure patterns by asset, (2) repair-vs-replace calls with reasoning, (3) preventive maintenance gaps suggested by the pattern of breakdowns, (4) vendor performance observations. Use ₹ formatting.`;
  Hub.run({
    out: '#out', button: '#runBtn',
    system: 'You are an experienced hospital facilities/biomedical maintenance manager at a 350-bed Kerala hospital, expert in ticket triage, MTTR analysis and asset lifecycle decisions.',
    prompt, demo: DEMO[key], manualMinutes: 90,
  });
});
</script>
</body>
</html>
