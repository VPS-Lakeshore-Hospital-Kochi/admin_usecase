<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reorder & expiry watch</title>
<link rel="stylesheet" href="../shared/hub.css">
</head>
<body>
<main class="wrap">
  <section class="page-head">
    <h1>Reorder & expiry watch</h1>
    <p>Pharmacy/consumables stock scan for reorder timing, near-expiry exposure and slow movers.</p>
  </section>

  <div id="kpis" class="kpis"></div>

  <div class="grid cols-2">
    <div class="card">
      <h2>Sample stock table</h2>
      <div class="row">
        <label style="margin:0" for="scenario">Scenario</label>
        <select id="scenario">
          <option value="pharmacy">Pharmacy — high-value drugs</option>
          <option value="consumables">OT & ward consumables</option>
        </select>
      </div>
      <label>Item | On hand | Avg daily use | Lead time (days) | Nearest expiry | Unit cost (₹) — editable</label>
      <textarea id="stock" rows="12"></textarea>
      <div id="stockTable"></div>
      <div class="row" style="margin-top:12px"><button class="primary" id="runBtn">Run with Claude</button></div>
    </div>
    <div class="card">
      <h2>Claude output</h2>
      <div class="claude-out" id="out"></div>
    </div>
  </div>
  <p class="footer-note">Synthetic stock data for demonstration only.</p>
</main>

<script src="../shared/claude.js"></script>
<script>
Hub.mountHeader({ dept: 'Purchase & Stores', title: 'Reorder & expiry watch' });

const SCENARIOS = {
  pharmacy: {
    text: `Item | On hand | Avg daily use | Lead time | Nearest expiry | Unit cost
Inj. Tenecteplase 40mg | 6 | 0.4 | 10 | 2027-02-15 | 28500
Tab. Apixaban 5mg (strip of 10) | 180 | 14 | 7 | 2026-10-05 | 620
Inj. Rituximab 500mg | 4 | 0.3 | 21 | 2026-11-20 | 42000
Tab. Voriconazole 200mg (strip of 10) | 60 | 3 | 12 | 2026-10-12 | 1850
IV Immunoglobulin 5g | 8 | 0.5 | 18 | 2026-10-01 | 18500
Inj. Insulin Glargine (vial) | 220 | 9 | 6 | 2027-05-30 | 620`,
  },
  consumables: {
    text: `Item | On hand | Avg daily use | Lead time | Nearest expiry | Unit cost
Surgical sutures 3-0 (box of 12) | 340 | 22 | 5 | 2027-08-01 | 950
Cath lab guide wires | 18 | 3.5 | 14 | 2026-12-10 | 4200
Endotracheal tubes (assorted) | 260 | 12 | 7 | 2027-03-15 | 180
Dialysis bloodline sets | 45 | 8 | 10 | 2026-10-08 | 1150
Disposable trocars (laparoscopy) | 30 | 4 | 15 | 2026-11-25 | 3600
Robotic instrument arms (single-use) | 22 | 3 | 20 | 2026-10-15 | 62000`,
  },
};

function parseStock(text) {
  const today = new Date('2026-09-27');
  return text.trim().split('\n').slice(1).filter(Boolean).map(r => {
    const c = r.split('|').map(x => x.trim());
    const onHand = +c[1], avgUse = +c[2], leadTime = +c[3], expiry = c[4], cost = +c[5];
    const cover = avgUse > 0 ? onHand / avgUse : 999;
    const daysToExpiry = Math.round((new Date(expiry) - today) / 86400000);
    return { item: c[0], onHand, avgUse, leadTime, expiry, cost, cover, daysToExpiry };
  });
}

function renderTable(rows) {
  const box = document.getElementById('stockTable');
  const trs = rows.map(r => {
    const reorder = r.cover <= r.leadTime * 1.3;
    const nearExpiry = r.daysToExpiry <= 45;
    const tags = [];
    if (reorder) tags.push('<span class="tag warn">Reorder now</span>');
    if (nearExpiry) tags.push('<span class="tag bad">Near-expiry</span>');
    if (r.cover > r.leadTime * 4) tags.push('<span class="tag ok">Slow mover</span>');
    if (!tags.length) tags.push('<span class="tag ok">OK</span>');
    return `<tr><td>${Hub.esc(r.item)}</td><td class="num">${r.onHand}</td><td class="num">${r.cover.toFixed(1)}d</td><td class="num">${r.daysToExpiry}d</td><td>${tags.join(' ')}</td></tr>`;
  }).join('');
  box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Item</th><th class="num">On hand</th><th class="num">Days cover</th><th class="num">To expiry</th><th>Flags</th></tr></thead><tbody>${trs}</tbody></table></div>`;

  const reorderCount = rows.filter(r => r.cover <= r.leadTime * 1.3).length;
  const expiryValue = rows.filter(r => r.daysToExpiry <= 45).reduce((s, r) => s + r.onHand * r.cost, 0);
  const stockValue = rows.reduce((s, r) => s + r.onHand * r.cost, 0);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Items scanned</div><div class="value">${rows.length}</div></div>
    <div class="kpi"><div class="label">Reorder now</div><div class="value">${reorderCount}</div></div>
    <div class="kpi"><div class="label">Near-expiry value</div><div class="value">${Hub.inr(expiryValue)}</div></div>
    <div class="kpi"><div class="label">Total stock value</div><div class="value">${Hub.inr(stockValue)}</div></div>`;
}

function loadScenario(key) {
  document.getElementById('stock').value = SCENARIOS[key].text;
  renderTable(parseStock(SCENARIOS[key].text));
}
document.getElementById('scenario').addEventListener('change', e => loadScenario(e.target.value));
document.getElementById('stock').addEventListener('change', e => { try { renderTable(parseStock(e.target.value)); } catch (err) {} });
loadScenario('pharmacy');

const DEMO = {
pharmacy: `## Reorder list

| Item | Order qty | Reasoning |
|---|---|---|
| Inj. Tenecteplase 40mg | 6 units | Cover ~15 days against 10-day lead time is tight for a stroke/MI thrombolytic — reorder now, stock-out risk on a critical emergency drug is unacceptable |
| Tab. Apixaban 5mg | 100 strips | Cover ~13 days vs 7-day lead time is borderline; reorder to rebuild buffer before cardiology OPD volume rises |
| IV Immunoglobulin 5g | 6 units | Cover ~16 days vs 18-day lead time — already inside reorder zone, expedite order today |

## Expiry-risk actions
- **IV Immunoglobulin (expires 2026-10-01, 4 days away):** at current 0.5/day use, only ~2 units will be consumed before expiry. **Action: check with sister VPS units for inter-hospital transfer immediately**, or negotiate a vendor return/credit — do not wait for natural consumption.
- **Tab. Voriconazole (expires 2026-10-12):** 60 strips on hand against 3/day use — will consume in time, low risk, monitor only.

## Slow movers
- **Inj. Rituximab 500mg** — 4 units on hand, 0.3/day average use implies ~13 days cover, but low absolute volume and high unit cost (₹42,000) mean this is oncology-linked and demand-driven, not a true slow mover; verify against upcoming transplant/oncology case list before assuming excess.

## Stock-out risk narrative
The highest institutional risk is **Tenecteplase** — a single delayed delivery against a 10-day lead time could leave the stroke unit without a first-line thrombolytic during the reorder gap. Recommend an emergency safety-stock policy (minimum 10 units) for this drug specifically, given its use in time-critical stroke protocols, rather than relying on standard reorder-point logic.`,

consumables: `## Reorder list

| Item | Order qty | Reasoning |
|---|---|---|
| Dialysis bloodline sets | 60 sets | Cover ~5.6 days vs 10-day lead time — already breached reorder point, dialysis cannot pause, escalate as urgent PO |
| Robotic instrument arms | 20 units | Cover ~7.3 days vs 20-day lead time — high-value single-use item for the surgical robot program, a stock-out directly cancels scheduled robotic cases |
| Cath lab guide wires | 30 units | Cover ~5.1 days vs 14-day lead time — cardiology cath lab utilisation is high, reorder immediately |

## Expiry-risk actions
- **Dialysis bloodline sets (expires 2026-10-08, 11 days away):** at 8/day use, ~360 units will be consumed before expiry against 45 on hand — no expiry risk, consumption will clear stock well before the date.
- **Robotic instrument arms (expires 2026-10-15):** at 3/day use, ~54 units needed but only 22 on hand — **no expiry risk, but this reinforces the reorder urgency** since stock will run out from usage before it would ever expire.

## Slow movers
- **Surgical sutures 3-0** — 340 boxes on hand, 22/day use gives ~15 days cover against only a 5-day lead time; this is significantly overstocked (3x the reasonable buffer). Recommend trimming next PO quantity and redirecting working capital.

## Stock-out risk narrative
Three high-value, clinically time-critical items — dialysis bloodlines, cath lab guide wires and robotic instrument arms — are all inside or near their reorder point simultaneously. Given the hospital's cardiology, transplant and robotics case load, a coordinated urgent PO batch (rather than three separate small orders) is recommended to negotiate better freight terms and avoid repeated emergency purchase premiums.`
};

document.getElementById('runBtn').addEventListener('click', () => {
  const key = document.getElementById('scenario').value;
  const text = document.getElementById('stock').value;
  const prompt = `You are assisting Purchase & Stores at VPS Lakeshore Hospital, Kochi with pharmacy/consumables stock review.

Stock table (Item | On hand | Avg daily use | Lead time days | Nearest expiry | Unit cost ₹):
${text}

Provide: (1) a reorder list with recommended order quantities and reasoning, (2) expiry-risk actions for near-expiry batches (return to vendor, inter-department/inter-hospital transfer, or consumption plan), (3) slow movers to flag, (4) a short stock-out risk narrative highlighting the most clinically critical exposure. Use ₹ formatting.`;
  Hub.run({
    out: '#out', button: '#runBtn',
    system: 'You are an experienced hospital pharmacy/stores manager at a 350-bed Kerala hospital, expert in inventory control, reorder policy and expiry management.',
    prompt, demo: DEMO[key], manualMinutes: 90,
  });
});
</script>
</body>
</html>
