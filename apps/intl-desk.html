<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International patient desk assistant</title>
<link rel="stylesheet" href="../shared/hub.css">
<style>
  .fact { font-size:13px; padding:4px 0; border-bottom:1px solid var(--border); }
  .fact:last-child { border-bottom:none; }
  .fact b { color: var(--navy); }
</style>
</head>
<body>
<main class="wrap">
  <section class="page-head">
    <h1>International patient desk assistant</h1>
    <p>Draft replies to international enquiries — in the enquirer's language plus English — with estimates, document checklists and CRM notes.</p>
  </section>

  <div class="grid cols-2">
    <div class="card">
      <h2>Sample enquiry</h2>
      <div class="row">
        <label style="margin:0" for="scenario">Scenario</label>
        <select id="scenario">
          <option value="maldives">Email — Maldives family, liver transplant enquiry</option>
          <option value="oman">WhatsApp (Arabic) — Oman patient, knee replacement enquiry</option>
        </select>
      </div>
      <label>Incoming enquiry (editable)</label>
      <textarea id="enquiry" rows="9"></textarea>

      <label>Hospital facts on file</label>
      <div id="facts"></div>

      <div class="row" style="margin-top:12px">
        <button class="primary" id="runBtn">Run with Claude</button>
      </div>
    </div>
    <div class="card">
      <h2>Claude output</h2>
      <div class="claude-out" id="out"></div>
    </div>
  </div>

  <p class="footer-note">Synthetic enquiries for demonstration only. Patient names and message content are fictional.</p>
</main>

<script src="../shared/claude.js"></script>
<script>
Hub.mountHeader({ dept: 'International Patients', title: 'International patient desk assistant' });

const FACTS = {
  maldives: [
    ['Package (living-donor liver transplant)', '₹22–26 lakh, incl. donor + recipient surgery, 21-day recipient stay'],
    ['Pre-transplant workup', '~5–7 days, both donor and recipient, before surgery date is confirmed'],
    ['Typical total stay in Kochi', '4–5 weeks (recipient); donor discharged in ~10–12 days'],
    ['Medical visa invitation letter', 'Hospital issues signed invitation letter within 24 hrs of confirmed booking, for visa application at Indian Mission, Malé'],
    ['Airport pickup', 'Complimentary pickup from Cochin International Airport (COK) for confirmed transplant cases'],
    ['Interpreter', 'Dhivehi-English interpreter available on request, no extra charge for transplant patients'],
    ['Accommodation', 'Partnered guest house 5 min from hospital, ₹1,800–2,500/night, family discount for 2+ weeks'],
  ],
  oman: [
    ['Package (unilateral total knee replacement)', '₹3.8–4.5 lakh, incl. implant, 5-day stay, physiotherapy'],
    ['Pre-op workup', '1–2 days on arrival before surgery date'],
    ['Typical total stay in Kochi', '10–12 days including post-op physiotherapy review'],
    ['Medical visa invitation letter', 'Hospital issues Arabic + English invitation letter within 24 hrs of confirmed booking'],
    ['Airport pickup', 'Complimentary pickup from Cochin International Airport (COK)'],
    ['Interpreter', 'Arabic-English interpreter available on request, no extra charge'],
    ['Accommodation', 'Partnered service apartments near hospital, ₹2,200–3,000/night'],
  ],
};

const SCENARIOS = {
  maldives: `Subject: Liver transplant enquiry for my father

Dear Sir/Madam,

My father (62 yrs) has been diagnosed with liver cirrhosis and the doctors in Malé have recommended a living-donor liver transplant. I am willing to be the donor (his son, 34 yrs, blood group compatible). We were told VPS Lakeshore has a good transplant program.

Could you please tell us:
1. The approximate total cost for both of us (donor + recipient)
2. How long we would need to stay in Kochi
3. What visa process we need to follow
4. Whether someone can help us at the airport, since neither of us has travelled to India before

We would like to move quickly if possible. Thank you.

Regards,
Ahmed Fahad (Malé, Maldives)`,
  oman: `[WhatsApp message, in Arabic — translated for internal reference]

"مرحبا، والدتي تعاني من ألم شديد في الركبة اليمنى والطبيب هنا في مسقط قال إنها تحتاج إلى استبدال الركبة. سمعنا أن مستشفى Lakeshore في كوتشي جيد جدا لهذه العمليات. كم تكلفة العملية؟ وكم يوم يجب أن نبقى؟ وهل يوجد من يتحدث العربية هناك؟ نحتاج الرد بسرعة من فضلكم."

(Translation: Hello, my mother has severe pain in her right knee and the doctor here in Muscat said she needs a knee replacement. We heard Lakeshore hospital in Kochi is very good for this. What is the cost of the operation? How many days should we stay? Is there someone who speaks Arabic there? We need a quick reply please.)`,
};

function loadScenario(key) {
  document.getElementById('enquiry').value = SCENARIOS[key];
  document.getElementById('facts').innerHTML = FACTS[key].map(([k, v]) =>
    `<div class="fact"><b>${Hub.esc(k)}:</b> ${Hub.esc(v)}</div>`).join('');
}
document.getElementById('scenario').addEventListener('change', e => loadScenario(e.target.value));
loadScenario('maldives');

const DEMO = {
maldives: `## Reply (English)

Dear Mr. Fahad,

Thank you for reaching out to VPS Lakeshore Hospital, Kochi regarding your father's liver transplant. We understand the urgency and are glad to assist.

**Estimated package:** ₹22–26 lakh (combined donor + recipient surgery, based on standard evaluation; final quote after reports review).
**Stay in Kochi:** Approximately 4–5 weeks for your father; you (as donor) would be discharged in 10–12 days.
**Visa:** Once your evaluation reports are shared and dates confirmed, our International Desk issues a medical visa invitation letter within 24 hours — this is submitted to the Indian High Commission in Malé.
**Airport:** Complimentary pickup from Cochin International Airport is arranged for confirmed transplant cases; a Dhivehi-English interpreter will also be available throughout your stay at no extra cost.

Please share your father's recent liver function tests, imaging reports, and both your passport copies so our transplant team can begin the compatibility evaluation.

Warm regards,
International Patient Desk, VPS Lakeshore Hospital, Kochi

## Reply (Dhivehi — for outbound translation)

*[To be sent via professional Dhivehi translation service before dispatch; content mirrors the English reply above: package estimate, stay duration, visa process, airport/interpreter support, and document request.]*

## Estimate summary

| Item | Estimate |
|---|---|
| Donor + recipient surgery package | ₹22–26 lakh |
| Recipient stay | 4–5 weeks |
| Donor stay | 10–12 days |
| Accommodation (family, 4 weeks) | ~₹50,000–70,000 |

## Document checklist
- [ ] Both passports (validity 6+ months)
- [ ] Father's liver function tests, imaging (USG/CT/MRI), cirrhosis workup reports from Malé
- [ ] Donor (son) blood group and basic health screening reports
- [ ] Passport-size photographs (both) for visa application
- [ ] Medical visa invitation letter (to be issued by hospital on confirmation)
- [ ] Proof of relationship (for donor eligibility as per transplant regulations)

## Next steps
1. Request the above reports via email/WhatsApp within 48 hours.
2. On receipt, transplant team completes preliminary compatibility review (2–3 days).
3. Issue formal cost estimate and medical visa invitation letter.
4. Coordinate travel dates and airport pickup once visa is approved.

## CRM note
*Enquiry: Living-donor liver transplant, father (62)/son (34) donor pair, Malé, Maldives. High intent, wants to move quickly. Awaiting reports for compatibility review. Priority: High. Next follow-up: 48 hrs.*`,
oman: `## Reply (Arabic)

عزيزتنا،

شكراً لتواصلكم مع مستشفى VPS Lakeshore في كوتشي بخصوص عملية استبدال الركبة لوالدتكم. يسعدنا مساعدتكم.

**التكلفة التقديرية:** ٣.٨ إلى ٤.٥ لكه روبية هندية (تشمل الغرسة، الإقامة ٥ أيام، والعلاج الطبيعي).
**مدة الإقامة في كوتشي:** حوالي ١٠ إلى ١٢ يوماً شاملة المتابعة بعد العملية.
**اللغة:** يتوفر لدينا مترجم عربي-إنجليزي طوال فترة إقامتكم دون أي رسوم إضافية.
**التأشيرة:** بعد تأكيد الموعد، نقوم بإصدار خطاب دعوة طبي بالعربية والإنجليزية خلال ٢٤ ساعة.

يرجى إرسال تقارير الأشعة والفحوصات الطبية لوالدتكم حتى يتمكن فريقنا الطبي من تقديم تقييم أولي.

مع خالص التقدير،
مكتب المرضى الدوليين، مستشفى VPS Lakeshore

## Reply (English translation)

Dear Sir/Madam,

Thank you for contacting VPS Lakeshore Hospital, Kochi about your mother's knee replacement. We are happy to assist.

**Estimated cost:** ₹3.8–4.5 lakh (includes implant, 5-day stay, physiotherapy).
**Stay in Kochi:** Approximately 10–12 days including post-op follow-up.
**Language:** An Arabic-English interpreter is available throughout your stay at no extra charge.
**Visa:** Once the appointment is confirmed, we issue a medical visa invitation letter in Arabic and English within 24 hours.

Please share your mother's knee X-rays and any recent medical reports so our orthopaedic team can provide a preliminary assessment.

Warm regards,
International Patient Desk, VPS Lakeshore Hospital

## Estimate summary

| Item | Estimate |
|---|---|
| Knee replacement package | ₹3.8–4.5 lakh |
| Total stay | 10–12 days |
| Accommodation (10 nights) | ~₹22,000–30,000 |

## Document checklist
- [ ] Passport (validity 6+ months) for patient and one attendant
- [ ] Recent knee X-rays / MRI reports from Muscat
- [ ] Physician referral letter noting knee replacement recommendation
- [ ] Passport-size photographs for visa application
- [ ] Medical visa invitation letter (to be issued on booking confirmation)

## Next steps
1. Request X-rays/MRI and referral letter via WhatsApp within 24 hours.
2. Orthopaedic team reviews and confirms surgery suitability and firm quote.
3. Issue medical visa invitation letter in Arabic and English.
4. Confirm travel dates, arrange airport pickup and interpreter.

## CRM note
*Enquiry: Right knee replacement, mother (age unspecified), via WhatsApp in Arabic, Muscat, Oman. Requested quick response. Priority: Medium-High. Next follow-up: 24 hrs, pending X-rays.*`,
};

document.getElementById('runBtn').addEventListener('click', () => {
  const key = document.getElementById('scenario').value;
  const enquiry = document.getElementById('enquiry').value;
  const factsText = FACTS[key].map(([k, v]) => `${k}: ${v}`).join('\n');
  const prompt = `You are the International Patient Desk at VPS Lakeshore Hospital, Kochi. An enquiry has come in:

${enquiry}

Hospital facts on file:
${factsText}

Provide: (1) a reply in the enquirer's own language, (2) the same reply translated to English, (3) an estimate summary table, (4) a document checklist (passport, medical reports, visa etc), (5) next steps, (6) a short internal CRM note. Use ₹ lakh formatting for costs.`;
  Hub.run({
    out: '#out', button: '#runBtn',
    system: 'You are an experienced international patient coordinator at a 350-bed Kerala hospital handling enquiries from Maldives, GCC and Africa.',
    prompt, demo: DEMO[key], manualMinutes: 45,
  });
});
</script>
</body>
</html>
