<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEO / Chairman copilot</title>
<link rel="stylesheet" href="../shared/hub.css">
<style>
  /* local additions: kit.js has no date picker or chat components — built here, brand tokens only */
  .datebar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .datebar select { width:auto; min-width:170px; }
  .chat-log { display:flex; flex-direction:column; gap:10px; max-height:460px; overflow-y:auto; padding-right:2px; }
  .chat-msg.user { align-self:flex-end; background:var(--navy); color:#fff; border-radius:16px 16px 4px 16px; padding:8px 14px; max-width:80%; }
  .chat-msg.assistant { max-width:92%; }
  .chat-quick { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .chat-quick button { font-size:12px; padding:5px 12px; }
  .overdue-flag { color:var(--magenta); font-weight:500; }
  .preview-note { font-size:12px; color:var(--muted); margin:6px 0; }
</style>
</head>
<body>
<main class="wrap">
  <section class="page-head">
    <h1>CEO / Chairman copilot</h1>
    <p>The Management Office's daily cockpit: a morning brief, meeting notes turned into a tracked action list, and plain questions answered over the same KPI bundle.</p>
  </section>
  <div id="toolbar"></div>
  <div id="tabs"></div>
  <section id="view"></section>
</main>
<script src="../shared/claude.js"></script>
<script src="../shared/kit.js"></script>
<script>
const SLUG = 'ceo-copilot';
Hub.mountHeader({ dept: 'Management Office', title: 'CEO / Chairman copilot' });
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const parseDMY = s => { const [d, mon, y] = s.split('-'); return new Date(Number(y), MONTHS.indexOf(mon), Number(d)); };
const st = Hub.kit.state(SLUG, { tab: 'brief', selectedDate: null, actionStatus: {}, addedActions: [], reviews: {}, chat: [] });
let DATA, TODAY_STR, TODAY;

/* ================= TAB A: MORNING BRIEF ================= */
function dayByDate(dt) { return DATA.days.find(d => d.date === dt); }
function avg7(dt) {
  const idx = DATA.days.findIndex(d => d.date === dt);
  const from = Math.max(0, idx - 6);
  const window = DATA.days.slice(from, idx + 1);
  const s = k => window.reduce((a, d) => a + (k === 'downtime' ? 0 : d[k]), 0) / window.length;
  return {
    occupancyPct: s('occupancyPct'), revenueLakh: s('revenueLakh'), aopLakh: s('aopLakh'),
    erFootfall: s('erFootfall'), dischargeNoonPct: s('dischargeNoonPct'), tpaPending: s('tpaPending'),
    complaints: s('complaints'), cashCr: s('cashCr'), intlPatients: s('intlPatients'),
    downtimeTotal: window.reduce((a, d) => a + d.downtime.robot + d.downtime.cathLab + d.downtime.mri + d.downtime.ct, 0) / window.length,
  };
}
function delta(cur, avg, higherBetter, digits = 1) {
  const diff = cur - avg;
  if (Math.abs(diff) < 0.05) return '<span class="small">≈ 7-day avg</span>';
  const good = higherBetter ? diff > 0 : diff < 0;
  return `<span class="${good ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(digits)} vs 7-day avg</span>`;
}
function briefBundleText(day, a7) {
  const eDown = [];
  if (day.downtime.robot) eDown.push(`da Vinci robot down ${day.downtime.robot}h`);
  if (day.downtime.cathLab) eDown.push(`Cath Lab down ${day.downtime.cathLab}h`);
  if (day.downtime.mri) eDown.push(`MRI down ${day.downtime.mri}h`);
  if (day.downtime.ct) eDown.push(`CT down ${day.downtime.ct}h`);
  const top3 = DATA.esign.slice(0, 3).map(e => `${e.doc} — pending ${e.days}d with ${e.pendingWith}`).join(' | ');
  const overdue = combinedActions().filter(isOverdue).slice(0, 4).map(a => `${a.action} (${a.owner}, due ${a.due})`).join(' | ');
  return `DATE: ${day.date} (VPS Lakeshore Hospital, Kochi, 350-bed NABH-accredited multi-specialty hospital).
IP CENSUS: ${day.ipCensus}/${DATA.capacity} beds, occupancy ${day.occupancyPct}% (7-day avg ${a7.occupancyPct.toFixed(1)}%).
REVENUE: ₹${day.revenueLakh} lakh vs AOP ₹${day.aopLakh} lakh (${(((day.revenueLakh - day.aopLakh) / day.aopLakh) * 100).toFixed(1)}%); 7-day avg revenue ₹${a7.revenueLakh.toFixed(1)} lakh vs AOP ₹${a7.aopLakh.toFixed(1)} lakh.
ER FOOTFALL: ${day.erFootfall} (7-day avg ${a7.erFootfall.toFixed(0)}).
DISCHARGES BEFORE NOON: ${day.dischargeNoonPct}% (7-day avg ${a7.dischargeNoonPct.toFixed(0)}%).
TPA APPROVALS PENDING: ${day.tpaPending} cases (7-day avg ${a7.tpaPending.toFixed(0)}).
CRITICAL EQUIPMENT DOWNTIME TODAY: ${eDown.length ? eDown.join(', ') : 'none reported'}.
COMPLAINTS LOGGED: ${day.complaints} (7-day avg ${a7.complaints.toFixed(0)}).
CASH POSITION: ₹${day.cashCr} Cr.
INTERNATIONAL PATIENTS: ${day.intlPatients}.
E-SIGNATURE APPROVALS PENDING (top 3 by age): ${top3}.
OVERDUE ACTION ITEMS (from past management meetings): ${overdue || 'none'}.`;
}
function briefDemo(day, a7) {
  const missPct = (((day.revenueLakh - day.aopLakh) / day.aopLakh) * 100).toFixed(1);
  const eqLines = [];
  if (day.downtime.robot) eqLines.push(`- **da Vinci robot down ${day.downtime.robot}h today** — check with Surgery whether non-urgent robotic cases can shift to a conventional approach while it is out.`);
  if (day.downtime.cathLab) eqLines.push(`- **Cath Lab down ${day.downtime.cathLab}h today** — confirm no elective cath cases are being deferred beyond 48 hours.`);
  if (day.downtime.mri) eqLines.push(`- **MRI down ${day.downtime.mri}h today** — likely feeding the radiology wait-time complaints; watch the complaints count.`);
  if (day.downtime.ct) eqLines.push(`- **CT down ${day.downtime.ct}h today** — same radiology bottleneck risk as MRI.`);
  const overdue = combinedActions().filter(isOverdue).slice(0, 3);
  const topEsign = DATA.esign.slice(0, 3);
  return `## Morning brief — VPS Lakeshore, ${day.date}

**Headline:** Occupancy at ${day.occupancyPct}% (${day.ipCensus}/${DATA.capacity} beds); revenue ${day.revenueLakh >= day.aopLakh ? 'ahead of' : 'behind'} AOP by ${Math.abs(missPct)}%${eqLines.length ? ', and equipment downtime needs attention before today’s OT/radiology lists are finalised' : ''}.

| Metric | Today | 7-day avg |
|---|---|---|
| Occupancy | ${day.occupancyPct}% | ${a7.occupancyPct.toFixed(1)}% |
| Revenue vs AOP | ₹${day.revenueLakh}L / ₹${day.aopLakh}L (**${missPct}%**) | ₹${a7.revenueLakh.toFixed(1)}L / ₹${a7.aopLakh.toFixed(1)}L |
| ER footfall | ${day.erFootfall} | ${a7.erFootfall.toFixed(0)} |
| Discharges before noon | ${day.dischargeNoonPct}% | ${a7.dischargeNoonPct.toFixed(0)}% |
| TPA approvals pending | ${day.tpaPending} | ${a7.tpaPending.toFixed(0)} |
| Cash position | ₹${day.cashCr} Cr | — |

**Needs your eyes today**
${eqLines.length ? eqLines.join('\n') : '- No critical equipment down today — a clean day on that front.'}
- **${day.complaints} complaints logged** (7-day avg ${a7.complaints.toFixed(0)})${day.complaints > a7.complaints ? ' — above the recent run rate; worth a quick theme check.' : '.'}
- **${day.dischargeNoonPct}% discharges before noon** ${day.dischargeNoonPct < a7.dischargeNoonPct ? 'is below the 7-day average — a recurring driver of billing-delay complaints; ask Finance + Nursing to re-check the 2pm SOP.' : 'is holding steady.'}

**Who to call**
${overdue.length ? overdue.map(a => `- **${a.owner}** — "${a.action}" was due ${a.due} and is still ${a.status.toLowerCase()}.`).join('\n') : '- No overdue action items right now.'}

**Approvals waiting on you (e-signature)**
| Document | Pending with | Days |
|---|---|---|
${topEsign.map(e => `| ${e.doc} | ${e.pendingWith} | ${e.days} |`).join('\n')}

**Watch list:** ${day.intlPatients} international patients today — keep an eye on the trend against the 20% international-revenue goal from the last Chairman review.`;
}
function isOverdue(a) { return a.status !== 'Done' && parseDMY(a.due) < TODAY; }
function combinedActions() {
  const overrides = st.get().actionStatus || {};
  return DATA.actions.concat(st.get().addedActions || []).map(a => ({ ...a, status: overrides[a.id] || a.status }));
}

function brief(el) {
  const dt = st.get().selectedDate || TODAY_STR;
  const day = dayByDate(dt), a7 = avg7(dt);
  el.innerHTML = `
    <div class="datebar"><label for="briefDate" style="margin:0">Day</label>
      <select id="briefDate">${DATA.days.map(d => `<option value="${d.date}" ${d.date === dt ? 'selected' : ''}>${d.date}</option>`).join('')}</select>
      <span class="small">Defaults to the latest day. KPI tiles compare today against the trailing 7-day average.</span></div>
    <div class="kpis" id="briefKpis"></div>
    <div class="grid cols-2">
      <div class="card"><h2>Data bundle Claude sees</h2>
        <p class="small">Census, revenue vs AOP, ER, discharges, TPA, equipment downtime, complaints, cash, international patients, top e-signature approvals and overdue actions — for ${dt}.</p>
        <button class="primary" id="runBrief">Run with Claude — write the morning brief</button>
        <p class="small" style="margin-top:8px">For the CEO's own use — no approval step needed before reading or downloading this brief.</p>
      </div>
      <div class="card"><h2>Morning brief</h2><div class="claude-out" id="outBrief"></div></div>
    </div>`;
  const tiles = el.querySelector('#briefKpis');
  tiles.innerHTML = `
    <div class="kpi"><div class="label">Occupancy</div><div class="value">${day.occupancyPct}%</div><div class="delta">${delta(day.occupancyPct, a7.occupancyPct, true)}</div></div>
    <div class="kpi"><div class="label">Revenue vs AOP</div><div class="value">₹${day.revenueLakh}L</div><div class="delta ${day.revenueLakh >= day.aopLakh ? 'up' : 'down'}">${day.revenueLakh >= day.aopLakh ? '▲' : '▼'} vs AOP ₹${day.aopLakh}L</div></div>
    <div class="kpi"><div class="label">ER footfall</div><div class="value">${day.erFootfall}</div><div class="delta">${delta(day.erFootfall, a7.erFootfall, true, 0)}</div></div>
    <div class="kpi"><div class="label">Discharges before noon</div><div class="value">${day.dischargeNoonPct}%</div><div class="delta">${delta(day.dischargeNoonPct, a7.dischargeNoonPct, true, 0)}</div></div>
    <div class="kpi"><div class="label">TPA pending</div><div class="value">${day.tpaPending}</div><div class="delta">${delta(day.tpaPending, a7.tpaPending, false, 0)}</div></div>
    <div class="kpi"><div class="label">Cash position</div><div class="value">₹${day.cashCr} Cr</div></div>`;
  el.querySelector('#briefDate').onchange = e => { st.set({ selectedDate: e.target.value }); brief(el); };
  el.querySelector('#runBrief').onclick = () => Hub.run({
    out: '#outBrief', button: '#runBrief', manualMinutes: 45,
    system: 'You are the Chief of Staff / Management Office assistant to the CEO and Chairman of VPS Lakeshore, a 350-bed NABH-accredited hospital in Kochi. You write tight, specific morning briefs.',
    prompt: `Here is today's hospital operations data bundle:\n\n${briefBundleText(day, a7)}\n\nWrite a concise morning brief: a one-line headline, a KPI-vs-7-day-average table, a "needs your eyes today" section, a "who to call" section naming owners of overdue actions, a table of the top e-signature approvals pending, and a one-line watch list item. Use ₹ lakh/crore formatting and be specific about root causes where the data suggests one.`,
    demo: briefDemo(day, a7),
  });
}

/* ================= TAB B: ACTION TRACKER ================= */
function actionsTab(el) {
  el.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">Action tracker</h2>
        <button type="button" id="expTracker">Export tracker to Excel</button></div>
      <div id="tblActions"></div>
    </div>
    <div id="actionDetail" style="margin-top:14px"></div>
    <div class="card" style="margin-top:14px">
      <h2>Turn meeting notes into actions</h2>
      <label for="notesPick">Sample meeting notes</label>
      <select id="notesPick">${DATA.meetingNotes.map((n, i) => `<option value="${i}">${n.title} — ${n.date}</option>`).join('')}</select>
      <label for="notesText">Notes</label>
      <textarea id="notesText" style="min-height:260px"></textarea>
      <div class="row" style="margin-top:10px"><button class="primary" id="runExtract">Extract actions with Claude</button></div>
      <div class="claude-out" id="outExtract" style="margin-top:10px"></div>
      <div id="extractPreview" style="margin-top:10px"></div>
      <div id="extractReview" style="margin-top:10px"></div>
    </div>`;
  const setNotes = i => { el.querySelector('#notesText').value = DATA.meetingNotes[i].text; };
  setNotes(0);
  el.querySelector('#notesPick').onchange = e => setNotes(Number(e.target.value));
  drawActionsTable(el);
  el.querySelector('#expTracker').onclick = () => {
    Hub.kit.exportXlsx(combinedActions().map(a => ({ ID: a.id, Action: a.action, Owner: a.owner, Due: a.due, Status: isOverdue(a) ? 'Overdue' : a.status, Source: a.source })), 'ceo-copilot-action-tracker.xlsx', 'Actions');
    Hub.kit.log(SLUG, 'Exported action tracker to Excel');
  };
  el.querySelector('#runExtract').onclick = () => runExtract(el, Number(el.querySelector('#notesPick').value));
}
function drawActionsTable(el) {
  Hub.kit.table(el.querySelector('#tblActions'), {
    rows: combinedActions(), search: true, selectedKey: st.get().selectedAction,
    columns: [
      { key: 'id', label: 'ID' }, { key: 'action', label: 'Action' }, { key: 'owner', label: 'Owner' },
      { key: 'due', label: 'Due' },
      { key: 'status', label: 'Status', render: r => isOverdue(r) ? '<span class="tag bad">Overdue</span>' : `<span class="tag ${r.status === 'Done' ? 'ok' : 'warn'}">${Hub.esc(r.status)}</span>` },
      { key: 'source', label: 'Source meeting' },
    ],
    onRowClick: r => { st.set({ selectedAction: r.id }); actionDetail(el, r); },
  });
  const selId = st.get().selectedAction;
  if (selId) { const r = combinedActions().find(a => a.id === selId); if (r) actionDetail(el, r); }
}
function actionDetail(el, r) {
  const box = el.querySelector('#actionDetail');
  box.innerHTML = `<div class="card"><h2 style="margin-top:0">${Hub.esc(r.id)} — ${Hub.esc(r.action)}</h2>
    <p class="small">Owner: <b>${Hub.esc(r.owner)}</b> · Due ${Hub.esc(r.due)} · From ${Hub.esc(r.source)} ${isOverdue(r) ? '· <span class="overdue-flag">overdue</span>' : ''}</p>
    ${r.status === 'Done' ? '<span class="tag ok">Done</span>' : '<button type="button" id="markDone">Mark done</button>'}</div>`;
  const btn = box.querySelector('#markDone');
  if (btn) btn.onclick = () => {
    st.set(s => ({ actionStatus: { ...(s.actionStatus || {}), [r.id]: 'Done' } }));
    Hub.kit.log(SLUG, 'Marked action done', `${r.id} — ${r.action}`);
    actionsTab(document.getElementById('view'));
  };
}
const KPI_HINTS = ['CMI, ARPOB, ALOS', 'Revenue index vs Peer A', 'International revenue %', 'Robot utilisation %', 'Equipment utilisation %', 'MRI/CT wait time', 'Discharge-before-noon %'];
function extractRowsFor(idx) {
  // deterministic per-sample extraction so the preview table and the approved tracker rows always match
  return idx === 0 ? [
    { action: 'Set up recurring monthly CMI / ARPOB / ALOS dashboard', owner: 'Sameeraj Rao (Management Office)', due: '10-Oct-2026', kpi: 'CMI, ARPOB, ALOS' },
    { action: 'Start quarterly competitor benchmarking vs Peer A Kerala cluster', owner: 'SK (Strategy)', due: '31-Oct-2026', kpi: 'Revenue index vs Peer A' },
    { action: 'Build plan to grow international revenue from ~14% to 20%', owner: 'Marketing + International Desk', due: '15-Nov-2026', kpi: 'International revenue %' },
    { action: 'Design off-peak discount package for out-of-Kochi robotic surgery patients', owner: 'COO Sandeep Nair', due: '20-Oct-2026', kpi: 'Robot utilisation %' },
    { action: 'Explore revenue-share model for underused Cath Lab 2 / 2nd LINAC slot', owner: 'CFO Thomas Alex', due: '15-Nov-2026', kpi: 'Equipment utilisation %' },
    { action: 'Implement radiology token/priority system for full-bladder-prep cases', owner: 'Radiology HOD Dr. Vinod Pillai', due: '10-Oct-2026', kpi: 'MRI/CT wait time' },
    { action: 'Design and roll out patient-flow training module', owner: 'HR + Quality', due: '30-Nov-2026', kpi: 'Discharge-before-noon %' },
  ] : [
    { action: 'Open conversation with top 3 insurers on faster TPA turnaround', owner: 'CFO Thomas Alex', due: '15-Oct-2026', kpi: 'TPA approvals pending' },
    { action: 'Design documentation-completeness training for TPA desk staff', owner: 'HR + Quality', due: '20-Oct-2026', kpi: 'TPA approvals pending' },
    { action: 'Review 2pm discharge SOP with Finance and Nursing', owner: 'Finance + Nursing', due: '12-Oct-2026', kpi: 'Discharge-before-noon %' },
    { action: 'Prepare vendor AMC renewal calendar for critical equipment', owner: 'COO Sandeep Nair', due: '25-Oct-2026', kpi: 'Equipment downtime hours' },
    { action: 'Set up weekly complaints-theme review with department heads', owner: 'Medical Superintendent Dr. Leela Menon', due: '05-Oct-2026', kpi: 'Complaints logged' },
  ];
}
function extractDemo(idx, rows) {
  const notes = DATA.meetingNotes[idx];
  return `## Extracted actions — ${notes.title}, ${notes.date}

| Action | Owner | Due | Linked KPI |
|---|---|---|---|
${rows.map(r => `| ${r.action} | ${r.owner} | ${r.due} | ${r.kpi} |`).join('\n')}

---

### Follow-up email draft

**To:** meeting attendees
**From:** Sameeraj Rao, Management Office
**Subject:** Action tracker — ${notes.title}, ${notes.date}

Dear all,

Summarising the actions and owners agreed at our ${notes.date} meeting; I will track progress against these at the next monthly review.

${rows.map((r, i) => `${i + 1}. ${r.action} — ${r.owner}, by ${r.due}.`).join('\n')}

Please let me know if any due date or owner needs adjusting.

Best regards,
Sameeraj Rao`;
}
function runExtract(el, idx) {
  const rows = extractRowsFor(idx);
  const notes = el.querySelector('#notesText').value;
  Hub.run({
    out: '#outExtract', button: '#runExtract', manualMinutes: 40,
    system: 'You are the Management Office assistant at VPS Lakeshore, turning leadership meeting notes into a clean action tracker and a follow-up email. Today is ' + TODAY_STR + '.',
    prompt: `Here are meeting notes from VPS Lakeshore Hospital:\n\n${notes}\n\nExtract an action tracker (Action, Owner, Due date, Linked KPI) and draft a follow-up email from Sameeraj Rao to the attendees.`,
    demo: extractDemo(idx, rows),
  }).then(text => {
    if (!text) return;
    const prev = el.querySelector('#extractPreview');
    prev.innerHTML = '<p class="preview-note">Preview — rows Claude would add to the tracker once approved:</p><div id="prevTbl"></div>';
    Hub.kit.table(prev.querySelector('#prevTbl'), { rows, columns: [{ key: 'action', label: 'Action' }, { key: 'owner', label: 'Owner' }, { key: 'due', label: 'Due' }, { key: 'kpi', label: 'Linked KPI' }] });
    const item = { id: 'extract-' + idx, title: `Extracted actions — ${DATA.meetingNotes[idx].title}` };
    Hub.kit.review(el.querySelector('#extractReview'), {
      slug: SLUG, item, text, st,
      onDecision: status => {
        if (status !== 'approved') return;
        const already = (st.get().addedActions || []).some(a => a.source === `${DATA.meetingNotes[idx].title} — ${DATA.meetingNotes[idx].date}` && a.fromExtract === idx);
        if (already) return;
        const newRows = rows.map((r, i) => ({ id: `EX-${idx}-${i + 1}`, action: r.action, owner: r.owner, due: r.due, status: 'Not started', source: `${DATA.meetingNotes[idx].title} — ${DATA.meetingNotes[idx].date}`, fromExtract: idx }));
        st.set(s => ({ addedActions: [...(s.addedActions || []), ...newRows] }));
        Hub.kit.log(SLUG, 'Actions added to tracker', `${newRows.length} rows from ${DATA.meetingNotes[idx].title}`);
        drawActionsTable(document.getElementById('view'));
      },
    });
  });
}

/* ================= TAB C: ASK ================= */
function equipmentAnswer() {
  const totals = { robot: 0, cathLab: 0, mri: 0, ct: 0 };
  DATA.days.forEach(d => { totals.robot += d.downtime.robot; totals.cathLab += d.downtime.cathLab; totals.mri += d.downtime.mri; totals.ct += d.downtime.ct; });
  const ranked = Object.entries(totals).map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v);
  const names = { robot: 'da Vinci robot', cathLab: 'Cath Lab', mri: 'MRI', ct: 'CT' };
  const badDays = DATA.days.filter(d => d.downtime.robot + d.downtime.cathLab + d.downtime.mri + d.downtime.ct > 3 && d.revenueLakh < d.aopLakh).length;
  return `**Short answer:** over the last 30 days, **${names[ranked[0].k]}** logged the most downtime — **${ranked[0].v.toFixed(1)} hours** — and is the equipment hurting revenue most.

| Equipment | Downtime, last 30 days |
|---|---|
${ranked.map(r => `| ${names[r.k]} | ${r.v.toFixed(1)} hrs |`).join('\n')}

On ${badDays} of the last 30 days, total equipment downtime exceeded 3 hours **and** revenue missed AOP the same day — consistent with the ${names[ranked[0].k]} being a real revenue drag, not just a maintenance nuisance. Recommend prioritising its AMC/vendor response time and, per the last Chairman review, revisiting the revenue-share proposal for slots that sit idle rather than under repair.`;
}
function orthoAnswer() {
  const last7 = DATA.days.slice(-7);
  const missDays = last7.filter(d => d.revenueLakh < d.aopLakh).length;
  const robotDown = DATA.days.slice(-4).reduce((a, d) => a + d.downtime.robot, 0);
  return `**Short answer:** this data bundle doesn't carry a department-level (ortho) revenue split, so I can't confirm ortho specifically — but two signals in the bundle point at a plausible explanation.

1. Revenue missed AOP on **${missDays} of the last 7 days** — some ortho softness may be part of a broader shortfall, not ortho-specific.
2. The **da Vinci robot logged ${robotDown.toFixed(1)} hours of downtime in the last 4 days** — if ortho's robotic-assisted joint cases share that slot, this alone could suppress high-value ortho volume.

**Recommend:** pull the ortho-specific revenue and case-mix split from the MIS to confirm whether the gap is volume-driven, payer-mix driven, or a discharge/billing timing lag. I can re-run this once that cut is available.`;
}
function intlAnswer() {
  const last7 = DATA.days.slice(-7), prior7 = DATA.days.slice(-14, -7);
  const avg = arr => arr.reduce((a, d) => a + d.intlPatients, 0) / arr.length;
  const now7 = avg(last7), before7 = avg(prior7);
  const pendingIntl = DATA.esign.find(e => /maldives|international|gulf/i.test(e.doc));
  return `**Short answer:** international patient volume is trending **${now7 >= before7 ? 'up' : 'down'}** — 7-day average now ${now7.toFixed(1)} patients/day vs ${before7.toFixed(1)} the week before.

Against the Chairman's 20%-of-revenue goal (from ~14% baseline), this bundle doesn't carry a live revenue-share %, only patient counts — worth adding that split to the monthly dashboard (action already tracked).

${pendingIntl ? `**One lever right now:** "${pendingIntl.doc}" is pending signature with ${pendingIntl.pendingWith} (${pendingIntl.days} days) — signing this keeps the GCC/Maldives corridor plan moving.` : ''}`;
}
function tpaAnswer() {
  const last7 = DATA.days.slice(-7);
  const avgPending = last7.reduce((a, d) => a + d.tpaPending, 0) / last7.length;
  const trend = DATA.days.slice(-14, -7).reduce((a, d) => a + d.tpaPending, 0) / 7;
  return `**Short answer:** TPA approvals pending are averaging **${avgPending.toFixed(0)} cases** over the last 7 days, ${avgPending > trend ? 'up' : 'down'} from ${trend.toFixed(0)} the week before.

This matches the action already on the tracker — CFO to open a conversation with the top 3 insurers on turnaround, and a documentation-completeness module for the TPA desk. Recommend checking whether the increase concentrates in one payer before escalating hospital-wide.`;
}
function dischargeAnswer() {
  const last7 = DATA.days.slice(-7);
  const avgPct = last7.reduce((a, d) => a + d.dischargeNoonPct, 0) / last7.length;
  const avgComplaints = last7.reduce((a, d) => a + d.complaints, 0) / last7.length;
  return `**Short answer:** discharges before noon are averaging **${avgPct.toFixed(0)}%** over the last 7 days, alongside **${avgComplaints.toFixed(1)} complaints/day** — billing-delay-at-discharge is a recurring theme in those complaints. The 2pm discharge SOP review with Finance and Nursing (already on the tracker) is the right lever; worth checking whether housekeeping turnaround is the actual bottleneck before changing the SOP itself.`;
}
function cashAnswer() {
  const last = DATA.days[DATA.days.length - 1], first = DATA.days[0];
  return `**Short answer:** cash position is ₹${last.cashCr} Cr today, ${last.cashCr >= first.cashCr ? 'up' : 'down'} from ₹${first.cashCr} Cr 30 days ago. Comfortable for now; the CFO's flag on days-payable-outstanding against upcoming equipment AMC renewals is the thing to watch, not the balance itself.`;
}
function complaintAnswer() {
  const last7 = DATA.days.slice(-7).reduce((a, d) => a + d.complaints, 0);
  return `**Short answer:** ${last7} complaints logged in the last 7 days. The bundle doesn't carry themes day-by-day, but discharge delay and radiology wait time are the two recurring themes flagged in the last two management meetings — both already have tracked actions (2pm discharge SOP review; radiology token/priority system).`;
}
function genericAnswer(q) {
  const last = DATA.days[DATA.days.length - 1];
  return `I don't have a specific computed answer for "${q}" in this demo bundle. Here's what's live today: occupancy ${last.occupancyPct}%, revenue ₹${last.revenueLakh}L vs AOP ₹${last.aopLakh}L, ${DATA.esign.length} e-signature approvals pending, ${combinedActions().filter(isOverdue).length} overdue action items. Try asking about ortho revenue, equipment/downtime, international revenue, TPA approvals, discharges, cash, or complaints — those are wired to the data.`;
}
const KEYWORD_TABLE = [
  { any: ['ortho'], fn: orthoAnswer }, { any: ['equipment', 'downtime', 'robot', 'cath', 'mri', 'ct scan', ' ct '], fn: equipmentAnswer },
  { any: ['international', 'intl', 'gcc', 'maldives'], fn: intlAnswer }, { any: ['tpa', 'insurance', 'approval'], fn: tpaAnswer },
  { any: ['discharge', 'noon'], fn: dischargeAnswer }, { any: ['cash', 'dpo'], fn: cashAnswer }, { any: ['complaint'], fn: complaintAnswer },
];
function computeAskAnswer(q) {
  const lq = ' ' + q.toLowerCase() + ' ';
  const hit = KEYWORD_TABLE.find(k => k.any.some(w => lq.includes(w)));
  return hit ? hit.fn() : genericAnswer(q);
}
function ask(el) {
  const chat = st.get().chat || [];
  el.innerHTML = `<div class="card">
      <h2>Ask about the KPI bundle</h2>
      <p class="small" style="margin-top:-6px">Multi-turn chat over the same 30-day data bundle shown in the other tabs.</p>
      <div class="chat-quick">
        <button type="button" data-q="Why is ortho revenue down this month?">Why is ortho down?</button>
        <button type="button" data-q="Which equipment is hurting revenue the most?">Which equipment is hurting revenue?</button>
        <button type="button" data-q="How are we tracking on the 20% international revenue goal?">International revenue goal?</button>
      </div>
      <div class="chat-log" id="chatLog"></div>
      <div class="row" style="margin-top:10px">
        <textarea id="chatInput" data-upload="off" style="min-height:60px" placeholder="Ask a question…"></textarea>
      </div>
      <div class="row" style="margin-top:6px"><button class="primary" id="chatSend">Send</button>
        <button type="button" id="chatClear">Clear chat</button></div>
    </div>`;
  const log = el.querySelector('#chatLog');
  function renderChat() {
    log.innerHTML = chat.map(m => m.role === 'user'
      ? `<div class="chat-msg user">${Hub.esc(m.content)}</div>`
      : `<div class="chat-msg assistant claude-out">${Hub.md(m.content)}</div>`).join('') || '<p class="small">Ask a question to start.</p>';
    log.scrollTop = log.scrollHeight;
  }
  renderChat();
  el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { el.querySelector('#chatInput').value = b.dataset.q; send(); });
  el.querySelector('#chatSend').onclick = send;
  el.querySelector('#chatClear').onclick = () => { st.set({ chat: [] }); ask(document.getElementById('view')); };
  async function send() {
    const ta = el.querySelector('#chatInput'), q = ta.value.trim();
    if (!q) return;
    const btn = el.querySelector('#chatSend'); btn.disabled = true;
    chat.push({ role: 'user', content: q }); renderChat(); ta.value = '';
    const holder = document.createElement('div'); holder.className = 'chat-msg assistant claude-out';
    holder.innerHTML = '<p class="thinking">Claude is working</p>'; log.appendChild(holder); log.scrollTop = log.scrollHeight;
    const text = await Hub.ask({
      system: 'You are the Management Office analyst answering the CEO/Chairman\'s ad-hoc questions over a VPS Lakeshore KPI bundle. Be honest about data limitations rather than fabricating numbers.',
      messages: chat.map(m => ({ role: m.role, content: m.content })),
      demo: computeAskAnswer(q),
      onText: partial => { holder.innerHTML = Hub.md(partial); log.scrollTop = log.scrollHeight; },
    });
    chat.push({ role: 'assistant', content: text }); st.set({ chat });
    renderChat(); btn.disabled = false;
  }
}

/* ================= TAB D: DASHBOARD ================= */
function dashboard(el) {
  const last = DATA.days[DATA.days.length - 1];
  const totalDown = k => DATA.days.reduce((a, d) => a + d.downtime[k], 0);
  const mtdRev = DATA.days.reduce((a, d) => a + d.revenueLakh, 0), mtdAop = DATA.days.reduce((a, d) => a + d.aopLakh, 0);
  el.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">Occupancy (latest)</div><div class="value">${last.occupancyPct}%</div></div>
      <div class="kpi"><div class="label">30-day revenue vs AOP</div><div class="value">₹${(mtdRev / 100).toFixed(2)} Cr</div><div class="delta ${mtdRev >= mtdAop ? 'up' : 'down'}">vs AOP ₹${(mtdAop / 100).toFixed(2)} Cr</div></div>
      <div class="kpi"><div class="label">E-signature approvals pending</div><div class="value">${DATA.esign.length}</div></div>
      <div class="kpi"><div class="label">Overdue action items</div><div class="value">${combinedActions().filter(isOverdue).length}</div></div>
    </div>
    <div class="grid cols-2">
      <div class="card" id="cRev"></div>
      <div class="card" id="cOcc"></div>
      <div class="card" id="cEq"></div>
      <div class="card" id="cIntl"></div>
    </div>`;
  const labels = DATA.days.map(d => d.date.slice(0, 6));
  Hub.chart.line(el.querySelector('#cRev'), {
    title: 'Revenue vs AOP', sub: '₹ lakh, last 30 days', labels,
    series: [{ name: 'Revenue', values: DATA.days.map(d => d.revenueLakh * 100000) }, { name: 'AOP', values: DATA.days.map(d => d.aopLakh * 100000) }],
  });
  Hub.chart.line(el.querySelector('#cOcc'), {
    title: 'Occupancy', sub: '% of 350 beds, last 30 days', labels,
    series: [{ name: 'Occupancy', values: DATA.days.map(d => d.occupancyPct) }], format: v => `${Math.round(v)}%`,
  });
  Hub.chart.hbar(el.querySelector('#cEq'), {
    title: 'Critical equipment downtime', sub: 'total hours, last 30 days',
    data: [
      { label: 'da Vinci robot', value: totalDown('robot') }, { label: 'Cath Lab', value: totalDown('cathLab') },
      { label: 'MRI', value: totalDown('mri') }, { label: 'CT', value: totalDown('ct') },
    ], format: v => `${v.toFixed(1)} hrs`,
  });
  Hub.chart.line(el.querySelector('#cIntl'), {
    title: 'International patients', sub: 'per day, last 30 days', labels,
    series: [{ name: 'International patients', values: DATA.days.map(d => d.intlPatients) }], format: v => String(Math.round(v)),
  });
}

/* ================= BOOT ================= */
Hub.kit.data(SLUG).then(d => {
  DATA = d;
  TODAY_STR = DATA.days[DATA.days.length - 1].date;
  TODAY = parseDMY(TODAY_STR);
  if (!st.get().selectedDate) st.set({ selectedDate: TODAY_STR });
  Hub.kit.toolbar(document.getElementById('toolbar'), {
    slug: SLUG, onReset: () => { st.reset(); location.reload(); },
    tour: [
      { sel: '.datebar', title: 'Pick a day', text: 'Defaults to the latest day. Change it and the KPI tiles update against that day\'s 7-day average.' },
      { sel: '#runBrief', title: 'Morning brief', text: 'Claude drafts the brief from the KPI bundle — for the CEO\'s own use, download as Word straight away.' },
      { sel: '#tabs', title: 'Four tabs', text: 'Morning brief, Action tracker, Ask, and Dashboard all read the same 30-day data bundle.' },
      { sel: '#tblActions', title: 'Action tracker', text: 'Roughly 25 actions from past management meetings, tagged overdue automatically.' },
      { sel: '#notesText', title: 'Meeting notes → actions', text: 'Paste (or pick a sample) set of notes; Claude extracts an action list you can preview before it is submitted.' },
      { sel: '#extractReview', title: 'Maker → approver', text: 'A CEO office executive submits the extracted list; the CEO approves before it lands in the tracker.' },
      { sel: '#tabs', title: 'Ask and Dashboard', text: 'Ask plain questions over the bundle, or see the same data as trend charts.' },
    ],
  });
  Hub.kit.tabs(document.getElementById('tabs'), [
    { id: 'brief', label: 'Morning brief' }, { id: 'actions', label: 'Action tracker' },
    { id: 'ask', label: 'Ask' }, { id: 'dash', label: 'Dashboard' },
  ], id => {
    st.set({ tab: id });
    ({ brief, actions: actionsTab, ask, dash: dashboard }[id])(document.getElementById('view'));
  }, st.get().tab);
});
</script>
